steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/chat-evaluation-harness:$COMMIT_SHA", .]
  - name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/chat-evaluation-harness:$COMMIT_SHA"]
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/chat-evaluation-harness:$COMMIT_SHA"
substitutions:
  _REGION: europe-west1
  _REPOSITORY: chat-evaluation-harness
options:
  logging: CLOUD_LOGGING_ONLY
