name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chat_eval
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: chat_eval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_eval -d chat_eval_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://chat_eval:ci-test-password@127.0.0.1:5432/chat_eval_test
      POSTGRES_TEST_URL: postgresql+psycopg://chat_eval:ci-test-password@127.0.0.1:5432/chat_eval_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip build && pip install -e '.[dev]'

      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .

      - name: Verify migrations
        run: |
          alembic upgrade head
          alembic check

      - name: Run tests
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Verify migration round trip
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Build package
        run: python -m build
