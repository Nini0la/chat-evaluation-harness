<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Model evaluation chat</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="access-gate" class="overlay hidden" role="dialog" aria-modal="true">
    <form id="access-form" class="card">
      <h1>Evaluation access</h1><p>Enter the invitation code to continue.</p>
      <input name="access_code" type="password" autocomplete="current-password" required>
      <button type="submit">Continue</button><p id="access-error" class="error"></p>
    </form>
  </div>
  <main class="shell">
    <header><div><h1>Evaluation chat</h1><p class="notice">Experimental model. Interactions are logged for evaluation. Do not submit sensitive or personally identifying information.</p></div><button id="new-chat" class="secondary">New Chat</button></header>
    <section id="messages" aria-live="polite" aria-label="Conversation"></section>
    <div id="status" class="status" role="status"></div>
    <form id="composer"><textarea id="message" rows="2" maxlength="20000" placeholder="Type a message…" required></textarea><button id="send" type="submit">Send</button></form>
  </main>
  <dialog id="report-dialog"><form id="report-form" method="dialog"><h2>Report a problem</h2><select name="failure_category"><option value="">No category</option><option>incorrect answer</option><option>hallucination</option><option>instruction-following failure</option><option>language-understanding failure</option><option>code-switching failure</option><option>unsafe response</option><option>over-refusal</option><option>repetition</option><option>irrelevant response</option><option>other</option></select><textarea name="comment" maxlength="5000" placeholder="Optional details"></textarea><div><button value="cancel" class="secondary">Cancel</button><button id="save-report" value="default">Save</button></div></form></dialog>
  <script src="/static/session-controller.js" defer></script>
  <script src="/static/app.js" defer></script>
</body></html>
